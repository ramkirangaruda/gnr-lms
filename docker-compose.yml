# One-server production setup: PostgreSQL + Redis + Django (gunicorn) + Caddy (automatic HTTPS).
# Start with:  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  web:
    build: .
    restart: unless-stopped
    env_file: .env   # includes BUNNY_STREAM_* (lesson videos) and EMAIL_* (password reset emails) keys, see README
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/media
    volumes: [media:/app/media]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      LMS_DOMAIN: ${LMS_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # nocopy: don't let the caddy image seed the shared uploads volume with its own files
      - {type: volume, source: media, target: /srv/media, read_only: true, volume: {nocopy: true}}
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
