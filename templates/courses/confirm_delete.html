{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-md-6"><div class="card p-4 text-center">
<i class="bi bi-exclamation-octagon display-4 text-danger"></i><h4 class="mt-2">Delete {{ kind }} “{{ obj }}”?</h4><p class="text-muted">{{ warning|default:"This cannot be undone." }}</p>
