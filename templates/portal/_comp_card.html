<div class="col-md-6 col-lg-4"><div class="card h-100">{% if c.banner %}<img src="{{ c.banner.url }}" class="course-thumb w-100" alt="" loading="lazy">{% else %}<div class="thumb-placeholder"><i class="bi bi-trophy"></i></div>{% endif %}
<div class="card-body"><h5><a class="text-dark text-decoration-none stretched-link" href="{% url 'competition_detail' c.pk %}">{{ c.title }}</a> {% if not c.is_published %}<span class="badge text-bg-warning">Draft</span>{% endif %}</h5>
<div class="small text-muted"><i class="bi bi-calendar-event"></i> {{ c.event_date|date:"d M Y" }}{% if c.venue %} · <i class="bi bi-geo-alt"></i> {{ c.venue }}{% endif %}</div>{% if c.eligibility %}<div class="small text-muted"><i class="bi bi-people"></i> {{ c.eligibility }}</div>{% endif %}</div></div></div>
