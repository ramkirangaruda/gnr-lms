{% if page.has_other_pages %}<nav><ul class="pagination pagination-sm">
{% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{k}}={{v|urlencode}}&{% endif %}{% endfor %}page={{ page.previous_page_number }}">‹ Prev</a></li>{% endif %}
<li class="page-item disabled"><span class="page-link">Page {{ page.number }} of {{ page.paginator.num_pages }} ({{ page.paginator.count }})</span></li>
{% if page.has_next %}<li class="page-item"><a class="page-link" href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{k}}={{v|urlencode}}&{% endif %}{% endfor %}page={{ page.next_page_number }}">Next ›</a></li>{% endif %}
</ul></nav>{% endif %}
